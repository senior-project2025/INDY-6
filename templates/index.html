{% extends "base.html" %}
{% block content %}

<!-- Hero Section -->
<section class="hero fade-in">
  <p class="mission" data-i18n="mission">{{ t('mission') }}</p>

  <!-- Promo video (optional placeholder) -->
  <div class="hero-video">
    <iframe
      width="100%"
      height="500"
      src="https://www.youtube.com/embed/VIDEO_ID?autoplay=1&mute=1&loop=1&playlist=VIDEO_ID"
      title="YouTube video"
      frameborder="0"
      allow="autoplay; encrypted-media"
      allowfullscreen
    ></iframe>
  </div>

  <!-- Device Selection -->
  <div class="device-card">
    <h3 data-i18n="choose_device">{{ t('choose_device') }}</h3>
    <div class="device-buttons">
      <a class="device-btn ios" href="{{ url_for('ios_page') }}" data-i18n="ios">
        {{ t('ios') }}
        <img
          src="{{ url_for('static', filename='images/ios.png') }}"
          alt="iOS Logo"
          class="platform-icon"
        />
      </a>
      <a class="device-btn android" href="{{ url_for('android_page') }}" data-i18n="android">
        {{ t('android') }}
        <img
          src="{{ url_for('static', filename='images/android.png') }}"
          alt="Android Logo"
          class="platform-icon"
        />
      </a>
    </div>
  </div>
</section>

<!-- Testimonials Section -->
<section class="testimonies fade-in">
  <h3 data-i18n="testimonies">{{ t('testimonies') }}</h3>
  <div class="testimony-list">
    {% for t_item in testimonies %}
    <blockquote class="testimony">
      <div class="testimony-content">
        <img src="{{ url_for('static', filename=t_item.img) }}" alt="{{ t_item.name }}">
        <div class="testimony-text">
          <p class="translate-text" data-translate-key="testimony_{{ loop.index }}">
            "{{ t_item.text }}"
          </p>
          <footer class="translate-text" data-translate-key="testimony_name_{{ loop.index }}">
            – {{ t_item.name }}
          </footer>
        </div>
      </div>
    </blockquote>
    {% endfor %}
  </div>
</section>

{% endblock %}
