{% extends "base.html" %}
{% block content %}
<div class="faq fade-in">
    <h1 class="page-header">Frequently Asked Questions</h1>
    <p>There is a list of frequently asked questions below:</p>

    <input id="faqSearch" placeholder="Search Questions" type="text" class="faq-search"/>

    <div class="faq-list">
        <p>Click or tap a question to see its answer</p>
        {% for item in faqs %}
        <div class="faq-item">
            <button class="faq-question">{{ item.q }}</button>
            <div class="faq-answer">
                <p>{{ item.a }}</p>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
