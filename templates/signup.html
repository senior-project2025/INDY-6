{% extends "base.html" %}
{% block content %}

<section class="signup-container fade-in">
    <h2>Create Your Account</h2>

    <form method="POST" action="{{ url_for('signup') }}" class="signup-form">

        <div class="form-group">
            <label for="name">{{ t('name') }}</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="email">{{ t('email') }}</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="password">{{ t('password') }}</label>
            <input type="password" id="password" name="password" required>
        </div>

        <button class="btn-primary" type="submit">{{ t('signup') }}</button>
    </form>

    <p>Already have an account? <a href="#" onclick="openLoginModal()">Login</a></p>
</section>

{% endblock %}
